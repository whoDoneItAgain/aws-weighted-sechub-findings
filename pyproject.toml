[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "awswsf.version.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}
dependencies = { file = ["requirements/base.txt"] }

[project]
name = "aws-wsf"
description = "AWS Weighted Security Hub Findings Analyzer"
requires-python = ">=3.13"
authors = [
  {email = "12127434+whoDoneItAgain@users.noreply.github.com"},
  {name = "whoDoneItAgain"},
]
license = "GPL-3.0-only"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dynamic = [
    "version",
    "readme"
]

[project.scripts]
aws-wsf = "awswsf.runner:main"

#[tool.setuptools.package-data]
#amc = ["data/**/*.yaml"]

[project.urls]
Homepage = "https://github.com/whoDoneItAgain/aws-weighted-sechub-findings"


[tool.pytest.ini_options]
addopts = [
  "-m not data"
]
markers = [
  "data: marks tests as slow (deselect with '-m \"not data\"')",
]
testpaths = [
    "test",
]
